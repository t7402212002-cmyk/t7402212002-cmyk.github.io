                <option value="fx"></option>
                <option value="tex"></option>
              </datalist>
            </label>
            <label>
              <span>Font</span>
              <select id="fontInput" name="fontSeries">
                <option class="font-option-none" value="">none</option>
                <option class="font-option-nu" value="multiplier">nu(&#20493;&#25976;)</option>
                <option class="font-option-nu" value="score">nu(&#20998;&#25976;)</option>
                <option class="font-option-text" value="text">text</option>
              </select>
            </label>
            <label>
              <span>State abc</span>
              <input id="stateInput" name="state" type="text" value="idle" autocomplete="off">
            </label>
            <label>
              <span>No.</span>
              <select id="numberInput" name="number">
                <option class="number-option-none" value="none">none</option>
                <option value="0">0</option>
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </label>
            <label>
              <span>Name</span>
              <input id="nameInput" name="baseName" type="text" value="wild symbol" list="namePrefixList" autocomplete="off">
              <datalist id="namePrefixList"></datalist>
            </label>
            <label>
              <span>Version</span>
              <input id="versionInput" name="version" type="text" value="v01" autocomplete="off">
            </label>
            <label>
              <span>Ext</span>
              <select id="extensionInput" name="extension">
                <option value="">none</option>
                <option value=".png" selected>.png</option>
                <option value=".jpg">.jpg</option>
                <option value=".json">.json</option>
                <option value=".atlas">.atlas</option>
                <option value=".skel">.skel</option>
                <option value=".prefab">.prefab</option>
                <option value=".mp3">.mp3</option>
                <option value=".wav">.wav</option>
              </select>
            </label>
          </div>

          <div class="switches">
            <label class="check">
              <input id="padInput" type="checkbox" checked>
              <span>&#24207;&#34399;&#35036;&#38646;</span>
            </label>
            <label class="check">
              <input id="asciiInput" type="checkbox" checked>
              <span>&#27284;&#21517;&#23433;&#20840;</span>
            </label>
            <label class="check">
              <input id="dateInput" type="checkbox">
              <span>&#21152;&#20837;&#26085;&#26399;</span>
            </label>
          </div>

          <label class="batch count-field">
            <span>&#25209;&#27425;&#25976;&#37327;</span>
            <input id="batchInput" name="batchCount" type="number" min="1" value="1">
          </label>
        </section>
      </form>

      <section class="recent-strip" aria-label="status">
        <div class="recent-meta">
          <span>&#26368;&#36817;&#29983;&#25104;</span>
          <strong id="resultCount">0</strong>
        </div>
        <p id="statusText">READY</p>
      </section>

      <section class="workspace" aria-label="naming workspace">
        <section class="panel output-panel" aria-label="results">
        <div class="section-head">
            <h2>&#29983;&#25104;&#32080;&#26524;</h2>
            <div class="head-actions">
              <button class="ghost" id="copyResultsBtn" type="button">COPY ALL</button>
              <span>.names</span>
            </div>
          </div>
          <div class="results" id="resultList" aria-live="polite"></div>
        </section>

        <aside class="side-column">
          <section class="panel history-panel" aria-label="history">
        <div class="section-head">
              <h2>&#26368;&#36817;</h2>
              <button class="ghost" id="clearHistoryBtn" type="button">&#28165;&#38500;</button>
            </div>
            <div class="history-list" id="historyList"></div>
          </section>
        </aside>
      </section>
    </main>

    <template id="resultRowTemplate">
      <article class="result-row">
        <code></code>
        <button class="copy-one" type="button">COPY</button>
      </article>
    </template>

    <script src="./app.js?v=20260702-final-folder1"></script>
  </body>
</html>
